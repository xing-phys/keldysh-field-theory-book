<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img"><title>Static disorder and white noise have different temporal kernels</title><rect width="940" height="440" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#263c45"><text x="42" y="38" font-size="23" font-weight="bold">The same spatial randomness can have different memory</text><text x="70" y="86" font-size="20">Quenched coupling J</text><text x="510" y="86" font-size="20">Markov noise ξ(t)</text><path d="M75 110 V315 H420 M515 110 V315 H860" fill="none" stroke="#7e8f91" stroke-width="1.5"/><path d="M80 175 H420" fill="none" stroke="#176b70" stroke-width="4"/><path d="M520 315 H660 L668 135 L676 315 H860" fill="none" stroke="#b87440" stroke-width="3"/><text x="245" y="347" text-anchor="middle" font-size="17">time difference t − t′</text><text x="690" y="347" text-anchor="middle" font-size="17">time difference t − t′</text><text x="100" y="145" font-size="18">⟨J(t)J(t′)⟩ = variance</text><text x="570" y="119" font-size="18">⟨ξ(t)ξ(t′)⟩ ∝ δ(t − t′)</text><text x="70" y="387" font-size="17">After averaging: two independent time integrals</text><text x="510" y="387" font-size="17">After averaging: a local time integral</text><text x="70" y="418" font-size="14" fill="#63747a">Schematic kernels, not spectral data. The delta peak is drawn with finite width.</text></g></svg>