<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img"><title>Closed time contour and classical/quantum fields</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#176b70"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#a66b42"/></marker></defs><rect width="960" height="290" rx="10" fill="#edf1eb"/><g font-family="DejaVu Sans, sans-serif" fill="#253f47"><text x="42" y="44" font-size="15" letter-spacing="2">TWO HISTORIES, ONE DENSITY MATRIX</text><path d="M105 102 H575" stroke="#176b70" stroke-width="4" marker-end="url(#arrow)"/><path d="M575 196 H105" stroke="#a66b42" stroke-width="4" marker-end="url(#gold)"/><path d="M575 102 C655 102 655 196 575 196" stroke="#80918b" stroke-width="2" fill="none"/><path d="M105 102 V196" stroke="#80918b" stroke-width="2" stroke-dasharray="5 5"/><text x="260" y="88" font-size="19">forward · φ₊</text><text x="258" y="228" font-size="19">backward · φ₋</text><text x="54" y="262" font-size="14">initial density matrix</text><text x="550" y="262" font-size="14">trace</text><path d="M680 75 V238" stroke="#c4cfca"/><text x="718" y="112" font-size="23" font-family="Georgia, serif">φc = (φ₊ + φ₋)/√2</text><text x="718" y="145" font-size="15">physical configuration</text><text x="718" y="190" font-size="23" font-family="Georgia, serif">φq = (φ₊ − φ₋)/√2</text><text x="718" y="223" font-size="15">response and fluctuations</text></g></svg>