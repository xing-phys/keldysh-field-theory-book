name: Build and publish book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre fonts-dejavu-core
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
          tinytex: true
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Check numerical examples
        run: julia --startup-file=no scripts/build_figures.jl
      - name: Render HTML and PDF
        run: quarto render
      - name: Verify references, navigation, and assets
        run: python3 scripts/check_book.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
